# =====================================================================
# [6장] application.yml : 프로그램 설정 파일 (3장부터 application.properties 대신 이 형식을 씁니다)
# 파일 위치 : src/main/resources/application.yml
# 읽는 시점 : 프로그램을 시작할 때 한 번 읽습니다.
# 6장 변경 : datasource(DB 접속 정보)와 h2 console 설정이 추가되었습니다.
#
# yml 형식 규칙
#   1) "키: 값" 형태로 씁니다. 키 뒤에는 콜론(:)을 붙이고, 콜론 뒤에 한 칸을 띄웁니다.
#   2) 들여쓰기로 상하 관계를 나타냅니다. 바로 위 항목보다 두 칸 더 들여쓴 항목은 그 항목의 하위 항목입니다.
#   3) 들여쓰기는 스페이스(칸)로 합니다. Tab 키를 쓰면 오류가 납니다.
#   4) 줄 맨 앞의 # 은 설명 글입니다. 프로그램은 이 줄을 무시합니다.
# =====================================================================

# 최상위 키 spring : 이 아래의 설정은 모두 spring 에 속합니다. 스프링 부트가 정해 둔 설정 이름입니다.
spring:

  # jpa : JPA 관련 설정 묶음입니다. JPA 는 자바 객체를 DB 의 표(테이블)와 연결해 저장하는 기능입니다.
  #   spring 의 하위 항목이므로 두 칸 들여쓰기를 합니다.
  jpa:

    # show-sql : true 이면 JPA 가 DB 에 보내는 SQL 명령을 콘솔(실행 결과 창)에 출력합니다.
    #   예) 회원을 저장하면 insert 구문이, 조회하면 select 구문이 콘솔에 나타납니다.
    show-sql: true

    # properties : JPA 구현체(Hibernate)에 직접 전달할 세부 설정 묶음입니다. jpa 의 하위 항목입니다.
    properties:

      # hibernate : Hibernate 전용 설정 묶음입니다. properties 의 하위 항목입니다.
      hibernate:

        # format_sql : true 이면 콘솔에 출력되는 SQL 을 줄바꿈과 들여쓰기로 보기 좋게 출력합니다.
        #   false 이면 한 줄로 길게 출력됩니다.
        format_sql: true

    # defer-datasource-initialization : true 이면 data.sql 실행을 "테이블 생성 이후"로 미룹니다.
    #   배경 : 기본 순서는 data.sql 이 먼저 실행됩니다. 그러면 아직 없는 member 테이블에 insert 하려다 오류가 납니다.
    #   이 설정으로 Hibernate 가 member 테이블을 먼저 만든 뒤에 data.sql 이 실행됩니다.
    defer-datasource-initialization: true

  # ---------------------------------------------------------------
  # [6장에서 추가] datasource : DB 접속 정보 묶음입니다. spring 의 하위 항목입니다.
  datasource:

    # url : 접속할 DB 주소입니다.
    #   jdbc:h2:mem:testdb = 메모리(mem) 방식의 H2 데이터베이스이며, 이름은 testdb 입니다.
    #   메모리 방식이라서 프로그램을 끄면 데이터가 모두 사라집니다.
    url: jdbc:h2:mem:testdb

    # username : DB 접속 사용자 이름입니다. H2 의 기본 사용자는 sa 입니다. 이 실습에서는 비밀번호를 설정하지 않습니다.
    username: sa

  # h2 : H2 데이터베이스의 웹 콘솔 설정 묶음입니다. spring 의 하위 항목입니다.
  h2:

    # console : 웹 브라우저에서 DB 내용을 보고 SQL 을 실행할 수 있는 H2 콘솔의 설정입니다.
    console:

      # enabled : true 이면 H2 콘솔을 켭니다. 접속 주소는 http://localhost:8080/h2-console 입니다.
      #   접속 화면에서 JDBC URL 에 jdbc:h2:mem:testdb, 사용자 이름에 sa 를 입력합니다.
      enabled: true
  # ai: 스프링 ai 모듈 설정
  ai:
    # openai: OpenAI 형식으로 대화하는 AI 서버 설정
    openai:
      #base-uri: api 요청을 보낼 주소
      base-uri: http://openrouter.ai/api

      # api 키 설정
      # 노출을 피하기 위해 환경변수에 등록하여 바인딩
      api-key: ${OPENROUTER_API_KEY}

      # 모델 명 설정
      chat:
        options:
          model: openrouter/free