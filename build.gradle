// =====================================================================
// build.gradle : 빌드 설정 파일입니다. Gradle 이 이 파일을 읽고 프로젝트를 컴파일, 테스트, 실행합니다.
// 파일 위치 : 프로젝트 최상위 폴더 (settings.gradle 과 같은 위치)
// 읽는 주체 : Gradle 빌드 도구
// 읽는 시점 : ./gradlew bootRun (실행), ./gradlew test (테스트) 를 입력할 때
// 문법 : Groovy 언어입니다. 줄 끝의 세미콜론(;)은 생략해도 됩니다. 문자열은 작은따옴표(')로 씁니다.
// 6장 변경 : H2 웹 콘솔(spring-boot-h2console)을 추가했습니다.
// =====================================================================

plugins {
    // id 'java' : 자바 플러그인을 켭니다. 컴파일(javac), 테스트 실행, jar 파일 만들기 기능이 들어 있습니다.
    id 'java'

    // id 'org.springframework.boot' version '4.0.1' : 스프링 부트 플러그인을 켭니다.
    //   bootRun : 프로그램을 바로 실행하는 명령을 만들어 줍니다. (./gradlew bootRun)
    //   bootJar : 실행 가능한 jar 파일을 만들어 줍니다.
    //   version '4.0.1' : 스프링 부트 버전을 4.0.1 로 고정합니다.
    id 'org.springframework.boot' version '4.0.1'

    // id 'io.spring.dependency-management' version '1.1.7' : 라이브러리 버전을 자동으로 맞춰 주는 플러그인입니다.
    //   스프링 부트가 권장하는 버전 조합을 자동으로 적용하므로, dependencies 에서는 대부분 버전 번호를 적지 않습니다.
    id 'io.spring.dependency-management' version '1.1.7'
}

// group : 프로젝트 그룹 이름입니다. 패키지 이름의 앞부분(com.shinsunyoung)과 맞춥니다.
group = 'com.shinsunyoung'


// version : 프로젝트 버전입니다. SNAPSHOT 은 아직 개발 중인 버전이라는 표시입니다.
//   settings.gradle 의 프로젝트 이름과 합쳐져 jar 파일 이름이 됩니다. 예) springboot-developer-0.0.1-SNAPSHOT.jar
version = '0.0.1-SNAPSHOT'

// description : 프로젝트 설명입니다. 실행 기능에는 영향이 없습니다.
description = 'springboot-developer'

java {
    toolchain {
        // languageVersion = JavaLanguageVersion.of(25) : 컴파일과 실행에 쓸 JDK 버전을 25 로 정합니다.
        //   ⚠ 주의 : PC 에 JDK 25 가 없으면 "toolchain" 관련 오류가 나면서 빌드가 멈춥니다.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    // mavenCentral() : 라이브러리를 내려받을 공개 저장소(Maven Central)입니다.
    //   처음 빌드할 때 인터넷 연결이 필요합니다. 한 번 내려받은 라이브러리는 다시 받지 않습니다.
    mavenCentral()
}

dependencies {
    // [implementation : 컴파일, 실행, 최종 jar 에 모두 포함합니다.]
    // spring-boot-starter : 스프링 부트 기본 묶음입니다. 스프링 핵심 기능과 실행 로그 기능이 들어 있습니다.
    //   starter-web 안에도 이미 들어 있어 중복 선언이지만 문제는 없습니다.
    implementation 'org.springframework.boot:spring-boot-starter'

    // [implementation : 컴파일, 실행, 최종 jar 에 모두 포함합니다.]
    // spring-boot-starter-web : 웹 기능 묶음입니다. 내장 톰캣(웹 서버), Spring MVC(요청 주소와 메소드 연결),
    //   Jackson(객체와 JSON 글자 상호 변환)이 들어 있습니다.
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // [testImplementation : 테스트 코드를 컴파일하고 실행할 때만 포함합니다. 배포용 jar 에는 들어가지 않습니다.]
    // spring-boot-starter-test : 테스트 도구 묶음입니다. JUnit 5(@Test), AssertJ(assertThat), Mockito(가짜 객체),
    //   Spring Test 가 들어 있습니다.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // [testImplementation : 테스트 코드를 컴파일하고 실행할 때만 포함합니다.]
    // spring-boot-starter-webmvc-test : MockMvc 를 자동으로 설정해 주는 테스트 도구입니다. 웹 요청을 흉내 내서 컨트롤러를 검사할 때 씁니다.
    //   스프링 부트 4.x 에서는 @AutoConfigureMockMvc 가 이 묶음에 들어 있으므로, 웹 테스트에 이 줄이 필요합니다.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // [testImplementation : 테스트 코드를 컴파일하고 실행할 때만 포함합니다.]
    // spring-boot-starter-data-jpa-test : @DataJpaTest 를 제공하는 테스트 묶음입니다. JPA 저장소 계층만 올려서 검사할 때 씁니다.
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    // [testRuntimeOnly : 테스트를 실행하는 순간에만 필요합니다. 코드를 컴파일할 때는 필요 없습니다.]
    // junit-platform-launcher : Gradle 이 JUnit 테스트를 찾아서 실행하도록 중간에서 연결해 주는 라이브러리입니다.
    //   실제 테스트 실행 엔진(JUnit Jupiter)은 starter-test 안에 들어 있습니다.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // [implementation : 컴파일, 실행, 최종 jar 에 모두 포함합니다.]
    // spring-boot-starter-data-jpa : JPA 기능 묶음입니다.
    //   JPA(자바 객체를 DB 표와 연결하는 규칙), Hibernate(JPA 를 실제로 실행하는 구현체),
    //   Spring Data JPA(Repository 인터페이스의 구현 객체를 자동으로 만들어 주는 기능)가 들어 있습니다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // [implementation : 컴파일, 실행, 최종 jar 에 모두 포함합니다.]
    // spring-boot-h2console : H2 웹 콘솔 기능입니다. 브라우저에서 http://localhost:8080/h2-console 로 DB 내용을 보고 SQL 을 실행할 수 있습니다.
    implementation 'org.springframework.boot:spring-boot-h2console'

    // [runtimeOnly : 실행할 때만 필요합니다. 코드에서 직접 import 하지 않는 라이브러리에 씁니다.]
    // com.h2database:h2 : H2 데이터베이스 라이브러리입니다. 프로그램 안에서 동작하는 메모리 DB 를 제공합니다.
    //   이 실습에서는 DB 서버를 따로 설치하지 않습니다.
    runtimeOnly 'com.h2database:h2'

    // [compileOnly : 컴파일할 때만 필요합니다. 실행 파일에는 포함하지 않습니다.]
    // org.projectlombok:lombok : @Getter, @Builder 같은 표시를 보고, getter 메소드나 생성자 같은 반복 코드를
    //   컴파일할 때 자동으로 만들어 주는 라이브러리입니다.
    compileOnly 'org.projectlombok:lombok'

    // [annotationProcessor : 컴파일할 때 어노테이션을 읽어서 코드를 만드는 도구로 등록합니다.]
    // 위 lombok 이 실제로 코드를 만드는 역할을 맡습니다. compileOnly 와 한 쌍으로 적습니다.
    annotationProcessor 'org.projectlombok:lombok'

    // 타임리프 view를 사용하기 위한 라이브러리
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
}

tasks.named('test') {
    // useJUnitPlatform() : 테스트를 JUnit 5 방식으로 실행합니다.
    //   이 설정이 없으면 @Test 메소드를 실행하지 못할 수 있습니다.
    useJUnitPlatform()
}
